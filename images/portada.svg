<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">UD2 · Programación en C#</title>
  <desc id="d">Portada de la unidad 2 del módulo Desarrollo de Interfaces: un editor de código con un programa de C# que recorre una lista, filtra con LINQ y escribe en consola, y una insignia con el texto C#.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1530"/>
      <stop offset="1" stop-color="#2b1a5c"/>
    </linearGradient>
    <linearGradient id="acento" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b7bff"/>
      <stop offset="1" stop-color="#4fc3f7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#fondo)"/>
  <!-- Retícula decorativa de 8 px ampliada (múltiplos de 40) -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200M0 320H1200M0 360H1200"/>
    <path d="M80 0V400M160 0V400M240 0V400M320 0V400M400 0V400M480 0V400M560 0V400M640 0V400M720 0V400M800 0V400M880 0V400M960 0V400M1040 0V400M1120 0V400"/>
  </g>

  <!-- Texto -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="60" y="80" fill="#cfc6f5" font-size="22" letter-spacing="3">DESARROLLO DE INTERFACES · 2DAM</text>
    <rect x="60" y="100" width="120" height="6" rx="3" fill="url(#acento)"/>
    <text x="60" y="185" fill="#ffffff" font-size="64" font-weight="700">UD2</text>
    <text x="60" y="250" fill="#ffffff" font-size="40" font-weight="600">Programación en C#</text>
    <text x="60" y="340" fill="#4fc3f7" font-size="22" font-weight="600">Prepara el RA1 · se evalúa en la UD3</text>
  </g>

  <!-- Motivo: editor con un programa de C# (bucle, LINQ y consola) e insignia C# -->
  <g transform="translate(660,60)">
    <rect width="420" height="280" rx="10" fill="#ffffff" fill-opacity="0.08" stroke="#cfc6f5" stroke-width="2"/>
    <rect width="420" height="34" rx="10" fill="#ffffff" fill-opacity="0.12"/>
    <text x="16" y="23" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="15" fill="#cfc6f5">Program.cs</text>
    <g font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="16" xml:space="preserve">
      <text x="20" y="70"><tspan fill="#9b7bff">var</tspan><tspan fill="#ffffff"> notas = [ 7, 4, 9, 6 ];</tspan></text>
      <text x="20" y="106"><tspan fill="#9b7bff">var</tspan><tspan fill="#ffffff"> aprobadas = notas</tspan></text>
      <text x="44" y="132"><tspan fill="#4fc3f7">.Where</tspan><tspan fill="#ffffff">(n =&gt; n &gt;= 5)</tspan></text>
      <text x="44" y="158"><tspan fill="#4fc3f7">.OrderBy</tspan><tspan fill="#ffffff">(n =&gt; n);</tspan></text>
      <text x="20" y="194"><tspan fill="#9b7bff">foreach</tspan><tspan fill="#ffffff"> (</tspan><tspan fill="#9b7bff">var</tspan><tspan fill="#ffffff"> n </tspan><tspan fill="#9b7bff">in</tspan><tspan fill="#ffffff"> aprobadas)</tspan></text>
      <text x="44" y="220"><tspan fill="#4fc3f7">Console</tspan><tspan fill="#ffffff">.WriteLine(n);</tspan></text>
      <text x="20" y="256" fill="#cfc6f5">// 6, 7, 9</text>
    </g>
  </g>
  <g transform="translate(1050,40)">
    <circle cx="40" cy="40" r="40" fill="url(#acento)"/>
    <text x="40" y="52" text-anchor="middle" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="32" font-weight="700" fill="#1a1530">C#</text>
  </g>
</svg>
